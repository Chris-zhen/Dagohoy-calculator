
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAGOHOY | Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
    --bg: #080d0b;
    --panel: #101a15;
    --button: #17221c;
    --operator: #183a2b;
    --green: #10b981;
    --light-green: #6ee7b7;
    --white: #ecfdf5;
    --muted: #668477;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background:
        radial-gradient(circle at 50% 20%, #123323 0%, transparent 40%),
        var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
}

.calculator {
    width: 100%;
    max-width: 390px;
    padding: 24px;
    border: 1px solid rgba(52, 211, 153, 0.13);
    border-radius: 28px;
    background: rgba(10, 18, 14, 0.96);
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 35px rgba(16, 185, 129, 0.07);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: #0d2b20;
    color: #34d399;
    border: 1px solid #1c4935;
}

.brand h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
}

.brand p {
    color: var(--light-green);
    font-size: 9px;
    letter-spacing: 3px;
    margin-top: 4px;
}

.version {
    font-size: 10px;
    color: var(--light-green);
    background: #123323;
    padding: 7px 11px;
    border-radius: 20px;
}

.display {
    background: var(--panel);
    border: 1px solid rgba(110, 231, 183, 0.08);
    padding: 22px 18px;
    border-radius: 18px;
    margin-bottom: 20px;
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    overflow: hidden;
}

.display-label {
    color: #86a99a;
    font-size: 10px;
    letter-spacing: 2px;
}

.previous {
    color: #668477;
    font-size: 14px;
    min-height: 20px;
    overflow-wrap: anywhere;
}

.current {
    font-size: clamp(27px, 8vw, 38px);
    font-weight: 600;
    color: var(--white);
    overflow-wrap: anywhere;
    word-break: break-all;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
}

button {
    height: 68px;
    border: 1px solid transparent;
    border-radius: 15px;
    background: var(--button);
    color: var(--white);
    font-family: inherit;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.18s ease;
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #20352a;
    border-color: rgba(110, 231, 183, 0.2);
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.94);
}

button svg {
    width: 21px;
    height: 21px;
    stroke-width: 2.2;
}

.operator {
    background: var(--operator);
    color: var(--light-green);
}

.operator:hover {
    background: #20533b;
}

.clear {
    color: #a7f3d0;
}

.equals {
    background: var(--green);
    color: #04150d;
    box-shadow: 0 5px 20px rgba(16, 185, 129, 0.2);
}

.equals:hover {
    background: #34d399;
    box-shadow: 0 5px 25px rgba(16, 185, 129, 0.35);
}

.zero {
    grid-column: span 1;
}

.footer {
    text-align: center;
    margin-top: 23px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 3px;
}

@media (max-width: 420px) {
    body {
        padding: 14px;
    }

    .calculator {
        padding: 18px;
    }

    button {
        height: 62px;
        border-radius: 13px;
    }

    .buttons {
        gap: 9px;
    }
}

@media (max-width: 340px) {
    .calculator {
        padding: 13px;
    }

    button {
        height: 55px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <div class="header">
        <div class="brand">
            <div class="logo">
                <i data-lucide="calculator"></i>
            </div>
            <div>
                <h1>DAGOHOY</h1>
                <p>CALCULATOR</p>
            </div>
        </div>
        <div class="version">v1.0</div>
    </div>

    <div class="display">
        <div class="display-label">RESULT</div>
        <div class="previous" id="previous"></div>
        <div class="current" id="display">0</div>
    </div>

    <div class="buttons">
        <button class="operator clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="changeSign()">±</button>
        <button class="operator" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperation('÷')"><i data-lucide="divide"></i></button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperation('×')"><i data-lucide="x"></i></button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperation('-')"><i data-lucide="minus"></i></button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperation('+')"><i data-lucide="plus"></i></button>

        <button class="operator" onclick="deleteNumber()"><i data-lucide="delete"></i></button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendDecimal()">.</button>
        <button class="equals" onclick="calculate()"><i data-lucide="equal"></i></button>
    </div>

    <div class="footer">MATTE BLACK · EMERALD GREEN</div>

</div>

<script>
const display = document.getElementById("display");
const previous = document.getElementById("previous");

let currentInput = "0";
let firstOperand = null;
let operator = null;
let shouldReset = false;

function updateDisplay() {
    display.textContent = currentInput;
    previous.textContent = firstOperand !== null
        ? `${firstOperand} ${operator || ""}`
        : "";
}

function appendNumber(number) {
    if (currentInput === "Error") clearDisplay();

    if (shouldReset) {
        currentInput = number;
        shouldReset = false;
    } else {
        if (currentInput === "0") {
            currentInput = number;
        } else if (currentInput.replace("-", "").length < 15) {
            currentInput += number;
        }
    }
    updateDisplay();
}

function appendDecimal() {
    if (currentInput === "Error") clearDisplay();

    if (shouldReset) {
        currentInput = "0.";
        shouldReset = false;
    } else if (!currentInput.includes(".")) {
        currentInput += ".";
    }
    updateDisplay();
}

function clearDisplay() {
    currentInput = "0";
    firstOperand = null;
    operator = null;
    shouldReset = false;
    updateDisplay();
}

function changeSign() {
    if (currentInput !== "0" && currentInput !== "Error") {
        currentInput = String(parseFloat(currentInput) * -1);
    }
    updateDisplay();
}

function percentage() {
    if (currentInput !== "Error") {
        currentInput = String(parseFloat(currentInput) / 100);
    }
    updateDisplay();
}

function chooseOperation(selectedOperator) {
    if (currentInput === "Error") return;

    const inputValue = parseFloat(currentInput);

    if (firstOperand !== null && !shouldReset) {
        calculate();
    }

    firstOperand = parseFloat(currentInput);
    operator = selectedOperator;
    shouldReset = true;
    updateDisplay();
}

function calculate() {
    if (firstOperand === null || operator === null || currentInput === "Error") return;

    const secondOperand = parseFloat(currentInput);
    let result;

    switch (operator) {
        case "+":
            result = firstOperand + secondOperand;
            break;
        case "-":
            result = firstOperand - secondOperand;
            break;
        case "×":
            result = firstOperand * secondOperand;
            break;
        case "÷":
            if (secondOperand === 0) {
                currentInput = "Error";
                firstOperand = null;
                operator = null;
                shouldReset = true;
                updateDisplay();
                return;
            }
            result = firstOperand / secondOperand;
            break;
        default:
            return;
    }

    currentInput = String(Number(result.toPrecision(12)));
    firstOperand = null;
    operator = null;
    shouldReset = true;
    updateDisplay();
}

function deleteNumber() {
    if (currentInput === "Error" || shouldReset) {
        currentInput = "0";
        shouldReset = false;
    } else {
        currentInput = currentInput.length > 1
            ? currentInput.slice(0, -1)
            : "0";

        if (currentInput === "-") currentInput = "0";
    }
    updateDisplay();
}

document.addEventListener("keydown", (event) => {
    if (event.key >= "0" && event.key <= "9") appendNumber(event.key);
    else if (event.key === ".") appendDecimal();
    else if (event.key === "+") chooseOperation("+");
    else if (event.key === "-") chooseOperation("-");
    else if (event.key === "*") chooseOperation("×");
    else if (event.key === "/") {
        event.preventDefault();
        chooseOperation("÷");
    }
    else if (event.key === "Enter" || event.key === "=") calculate();
    else if (event.key === "Backspace") deleteNumber();
    else if (event.key === "Escape") clearDisplay();
    else if (event.key === "%") percentage();
});

updateDisplay();
lucide.createIcons();
</script>

</body>
</html>
